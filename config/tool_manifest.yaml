  description: DOCX diffs, similarity reports, XLSX value comparison, and tabular reconciliation.
  description_ru: Сравнение DOCX, отчёты похожести, сверка XLSX и табличные расхождения.
  children:
  - id: docx_near_dupes
    title: DOCX similarity map
    title_ru: Карта сходства DOCX
    description: Recursive DOCX similarity map with exact duplicates, related-version candidates, and recommendations.
    description_ru: Рекурсивная карта сходства DOCX с точными дублями, кандидатами связанных версий и рекомендациями.
    service: system_core.services.office_service:docx_near_dupes
    kind: safe
    fields:
    - id: threshold
      type: text
      label: Threshold
      label_ru: Порог кандидатности
      default: '0.30'
    - id: write_diff
      type: checkbox
      label: Write diffs
      label_ru: Сохранять файл различий
      default: false
  - id: docx_pair_diff
    title: Diff two DOCX
    title_ru: Сравнить два DOCX в DocFlow
    description: Compare DOCX body text and tables by heading structure; table of contents is skipped.
    description_ru: Сравнить текст и таблицы DOCX по структуре заголовков; оглавление пропускается.
    service: system_core.services.office_service:docx_pair_diff
    kind: safe

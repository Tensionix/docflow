tool:
  id: audion_docflow
  name: Audion DocFlow
  category: Documents
  version: 1.2.0
paths:
  input: input
  output: output
  logs: logs
  workspace: workspace
  config: config
  release: release
ui:
  title: Audion DocFlow
  host: 127.0.0.1
  port: 8080
  native: false
  reload: false
  open_browser: true
operation_groups:
- id: audit_rules
  title: Rules audit
  title_ru: АУДИТ ПРАВИЛ
  description: Deterministic project audit rules, anchors, and approval workflow.
  description_ru: Детерминированные правила аудита, якоря и маршрут одобрения правок.
  children:
  - id: docx_audit_processor
    title: Audit processor
    title_ru: Аудит правил DOCX
    description: Scan and safely fix deterministic corporate writing rules.
    description_ru: 'Найти и безопасно исправить правила аудита: кв. м, №, %, градусы, даты и похожие случаи.'
    service: system_core.services.office_service:docx_audit_processor
    kind: safe
    fields:
    - id: write_audit_anchors
      type: checkbox
      label: Write audit anchors
      label_ru: Создать DOCX с якорями
      default: true
      span: full
      hint_ru: В output/audit_annotated создаются копии *__annotated.docx. Якоря показывают места правил до исправления.
    - id: apply_fixes
      type: checkbox
      label: Apply safe fixes
      label_ru: Применить безопасные правки
      default: false
    - id: dry_run
      type: checkbox
      label: Dry-run
      label_ru: Пробный запуск без записи DOCX
      default: false
  - id: docx_audit_strip_anchors
    title: Remove DOCX audit anchors
    title_ru: Снять якоря DOCX
    description: Remove service anchors from annotated DOCX after user-approved audit fixes.
    description_ru: Удалить служебные якоря ⟦...⟧ из _annotated DOCX после внесения и одобрения правок аудита.
    service: system_core.services.office_service:docx_audit_strip_anchors
    kind: safe
    fields:
    - id: audit_anchor_docx
      type: file
      label: DOCX with anchors
      label_ru: DOCX с якорями
      extensions: .docx
      span: full
      default: ''
      hint_ru: Если выбрать файл, якоря снимаются только с него. Если оставить пустым, обрабатываются все *__annotated.docx из input.
    - id: strip_all_docx
      type: checkbox
      label: All DOCX
      label_ru: Все DOCX, не только _annotated
      default: false
      span: full
- id: processors
  title: Styles and hygiene
  title_ru: СТИЛИ И ГИГИЕНА
  description: Core DOCX processors for styles and text hygiene.
  description_ru: 'Ключевые DOCX-процедуры: стили и текстовая гигиена.'
  children:
  - id: docx_deep_hygiene
    title: Text hygiene workbench
    title_ru: Гигиена текста
    description: Run text hygiene alone or with document anomaly checks in one operation.
    description_ru: Запустить старую текстовую гигиену и при необходимости подключить аномалии документа вторым проходом.
    service: system_core.services.office_service:docx_deep_hygiene
    kind: safe
    fields:
    - id: deep_hygiene_mode
      type: radio
      label: Mode
      label_ru: Режим
      default: scan
      field_group: hygiene_run
      group_title_ru: Запуск
      group_description_ru: Проверка строит отчёты без изменения документов; корректировка пишет только копии.
      hint_ru: Проверка ничего не меняет. Корректировка применяет безопасные правки к копиям DOCX.
      options:
      - value: scan
        label: Scan
        label_ru: Проверка
      - value: fix
        label: Fix
        label_ru: Корректировка
    - id: deep_hygiene_dot_spacing
      type: checkbox
      label: Dot spacing
      label_ru: Пробел после точки (эвристика)
      default: false
      field_group: hygiene_run
      group_title: Text hygiene parameters
      group_title_ru: Параметры текстовой гигиены
      hint_ru: Расширенная эвристика, выключена по умолчанию. Общее правило пропускает сокращения и единицы вроде кв.м, куб.м, руб., г.Тюмень, ул.Ленина; их должны находить и исправлять правила аудита или морфология с учётом контекста.
    - id: deep_hygiene_remove_strikethrough
      type: checkbox
      label: Remove strikethrough text
      label_ru: Удалять зачёркнутый текст
      default: false
      field_group: hygiene_run
      group_title: Text hygiene parameters
      group_title_ru: Параметры текстовой гигиены
      hint_ru: Меняет содержание документа, поэтому выключено по умолчанию. Включайте только когда зачёркнутый текст считается мусором, а не редакторской правкой.
    - id: deep_hygiene_include_audit
      type: checkbox
      label: Include audit rules
      label_ru: Правила аудита, проход 1
      default: true
      field_group: hygiene_run
      group_title: Text hygiene parameters
      group_title_ru: Параметры текстовой гигиены
      hint_ru: 'Включает: кв. м, куб. м, единицы измерения, №, %, градусы, даты с г. и похожие детерминированные правила. В проверке пишет отчёт; в корректировке применяет безопасные правки к копиям после текстовой гигиены.'
    - id: deep_hygiene_include_anomalies
      type: checkbox
      label: Include document anomalies
      label_ru: Аномалии документа в одном проходе
      default: false
      field_group: hygiene_run
      group_title: Text hygiene parameters
      group_title_ru: Параметры текстовой гигиены
      hint_ru: Запускает второй проход по форматным аномалиям. Текстовая гигиена отвечает за видимый текст, аномалии - за структуру и форматирование; в корректировке аномалии работают поверх копий, уже исправленных текстовой гигиеной.
  - id: docx_style_scan
    title: 'Style processing: scan'
    title_ru: Проверка стилей DOCX
    description: Find headings, captions, TOC markers, sections, and style consistency issues.
    description_ru: Найти заголовки, названия таблиц/рисунков, оглавление, секции и стилевые проблемы.
    service: system_core.services.office_service:docx_style_scan
    kind: safe
    fields:
    - id: reference_docx
      type: text
      label: Reference DOCX
      label_ru: Эталон стилей DOCX
      default: ''
      field_group: style_reference
      group_title_ru: Эталон
      group_description_ru: Необязательный DOCX с вручную назначенными нужными стилями.
      hint_ru: 'Необязательно. DOCX из input, где нужные стили уже назначены вручную: заголовки, подписи, оглавление, приложения
        и списки. Например: Каскаринское СП ОМ Эталон.docx'
  - id: docx_style_fix
    title: 'Style processing: fix'
    title_ru: Исправление стилей DOCX
    description: Conservatively assign existing styles to recognizable headings, captions, and TOC titles.
    description_ru: Осторожно назначить существующие стили для распознанных заголовков, подписей и оглавления.
    service: system_core.services.office_service:docx_style_fix
    kind: safe
    fields:
    - id: reference_docx
      type: text
      label: Reference DOCX
      label_ru: Эталон стилей DOCX
      default: ''
      field_group: style_reference
      group_title_ru: Эталон
      group_description_ru: Необязательный DOCX с вручную назначенными нужными стилями.
      hint_ru: 'Необязательно. DOCX из input, где нужные стили уже назначены вручную: заголовки, подписи, оглавление, приложения
        и списки. Например: Каскаринское СП ОМ Эталон.docx'
  - id: docx_text_hygiene_scan
    title: Text hygiene scan
    title_ru: 'Гигиена текста: проверка'
    description: Find spacing and punctuation issues.
    description_ru: Найти проблемы пробелов и пунктуации.
    service: system_core.services.office_service:docx_text_hygiene_scan
    kind: safe
    fields:
    - id: check_dot
      type: checkbox
      label: Check dot spacing
      label_ru: Проверять пробел после точки (эвристика)
      default: false
      hint_ru: Расширенная эвристика. Общая проверка пропускает типовые сокращения и единицы вроде кв.м, куб.м, руб., г.Тюмень, ул.Ленина; эти случаи относятся к правилам аудита или морфологии.
  - id: docx_text_hygiene_fix
    title: Text hygiene fix
    title_ru: 'Гигиена текста: исправить'
    description: Apply safe text-node fixes.
    description_ru: Исправить только текст, не меняя структуру документа.
    service: system_core.services.office_service:docx_text_hygiene_fix
    kind: safe
    fields:
    - id: fix_dot
      type: checkbox
      label: Fix dot spacing
      label_ru: Исправлять пробел после точки (эвристика)
      default: false
      hint_ru: Расширенная безопасная правка. Общее правило пропускает типовые сокращения и единицы вроде кв.м, куб.м, руб., г.Тюмень, ул.Ленина; исправлять их должен слой правил аудита или морфологический слой.
    - id: remove_strikethrough
      type: checkbox
      label: Remove strikethrough text
      label_ru: Удалять зачёркнутый текст
      default: false
      hint_ru: Меняет содержание документа, поэтому вынесено в отдельный явный параметр и выключено по умолчанию.
  - id: docx_anomaly_scan
    title: DOCX anomaly scan
    title_ru: Проверка аномалий DOCX
    description: Read-only scan for visible DOCX formatting and structure anomalies.
    description_ru: 'Найти явные аномалии форматирования и структуры DOCX: таблицы, подписи, секции, ориентацию, пустоты и заголовки.'
    service: system_core.services.office_service:docx_anomaly_scan
    kind: safe
    fields:
    - id: check_tables
      type: checkbox
      label: Check tables
      label_ru: Проверять таблицы
      default: true
      field_group: anomaly_classes
      group_title_ru: Классы проверок
      group_description_ru: Включите типы аномалий, которые попадут в единый отчёт с человеческой локацией.
      hint_ru: 'Включает: ширину относительно полей и обрезку, полностью пустые строки/колонки, смешанные границы и поля ячеек, смесь шрифтов/кеглей, плотность, подозрительные объединения, точную высоту строк, запрет переноса текста в ячейках и повтор шапки.'
    - id: check_captions
      type: checkbox
      label: Check captions
      label_ru: Проверять подписи
      default: true
      field_group: anomaly_classes
      hint_ru: 'Включает: пропуски, дубли и обратный ход номеров Таблиц/Рисунков, подпись далеко от объекта, подпись на другой странице, объект без подписи среди подписанных, неверную сторону подписи.'
    - id: check_layout
      type: checkbox
      label: Check sections and orientation
      label_ru: Проверять секции и ориентацию
      default: true
      field_group: anomaly_classes
      hint_ru: 'Включает: альбомные секции без широкой таблицы, портретные секции с явно широкой таблицей, поля секций, отличающиеся от основного профиля без видимой причины.'
    - id: check_headers
      type: checkbox
      label: Check headers and page numbers
      label_ru: Проверять колонтитулы и номера страниц
      default: true
      field_group: anomaly_classes
      hint_ru: 'Включает: отличающиеся верхние и нижние колонтитулы между секциями, съехавшие колонтитулы, явный старт или перезапуск нумерации страниц, особенно на первом листе.'
    - id: check_fields
      type: checkbox
      label: Check fields and links
      label_ru: Проверять поля и ссылки
      default: true
      field_group: anomaly_classes
      hint_ru: 'Включает: оглавление, REF, SEQ, PAGE, PAGEREF, видимые ошибки полей, подозрительный текст полей, битые внутренние ссылки, повреждённые или дублирующиеся закладки.'
    - id: check_lists
      type: checkbox
      label: Check lists and numbering
      label_ru: Проверять списки и нумерацию
      default: true
      field_group: anomaly_classes
      hint_ru: 'Включает: ручные номера вместо встроенной нумерации списков Word, пропуски логических номеров, дубли, обратный ход, лишние/недостаточные точки, висячие подпункты.'
    - id: check_spacing
      type: checkbox
      label: Check blanks and headings
      label_ru: Проверять пустоты и заголовки
      default: true
      field_group: anomaly_classes
      hint_ru: 'Включает: две и более пустые строки подряд, почти пустые места, заголовок в конце страницы без текста после него, таблицу/объект, оторванные от вводного абзаца или подписи.'
    - id: max_findings_per_file
      type: number
      label: Max findings per file
      label_ru: Максимум находок на файл
      default: 300
      min: 1
      max: 5000
      step: 50
      field_group: anomaly_report
      group_title_ru: Отчёт
      group_description_ru: Ограничение защищает отчёт от разрастания на сильно повреждённых документах.
      hint_ru: В JSON остаётся тот же лимит. Увеличьте значение, если нужен полный список по большому документу.
  - id: docx_anomaly_correct
    title: DOCX anomaly correction
    title_ru: Корректировка аномалий DOCX
    description: Apply selected safe anomaly fixes to copied DOCX files.
    description_ru: 'Применить выбранные безопасные правки аномалий к копиям DOCX: пустые абзацы, высота строк, перенос текста и опционально таблицы.'
    service: system_core.services.office_service:docx_anomaly_correct
    kind: safe
    fields:
    - id: fix_empty_paragraphs
      type: checkbox
      label: Collapse duplicated blank paragraphs
      label_ru: Удалять лишние пустые абзацы
      default: true
      field_group: anomaly_safe_fixes
      group_title_ru: Безопасные правки
      group_description_ru: Эти операции пишут копии DOCX и не меняют исходные файлы.
      hint_ru: В серии из двух и более пустых абзацев оставляется один. Абзацы с разрывами секций, полями, закладками и рисунками не удаляются.
    - id: fix_row_heights
      type: checkbox
      label: Remove exact row heights
      label_ru: Снимать точную высоту строк
      default: true
      field_group: anomaly_safe_fixes
      hint_ru: Убирает режим exact у высоты строк таблиц, чтобы Word не резал переносимый текст.
    - id: fix_nowrap
      type: checkbox
      label: Enable cell text wrapping
      label_ru: Включать перенос текста в ячейках
      default: true
      field_group: anomaly_safe_fixes
      hint_ru: Удаляет запрет переноса текста из ячеек таблиц, чтобы длинный текст мог переноситься.
    - id: normalize_table_borders
      type: checkbox
      label: Normalize table borders
      label_ru: Унифицировать границы таблиц
      default: false
      field_group: anomaly_table_fixes
      group_title_ru: Опциональная унификация таблиц
      group_description_ru: Более заметные правки оформления таблиц. Включайте осознанно.
      hint_ru: Ставит единые чёрные одинарные границы таблиц. По умолчанию выключено, потому что меняет внешний вид всех таблиц.
    - id: border_size
      type: number
      label: Border thickness
      label_ru: Толщина границ
      default: 4
      min: 1
      max: 24
      step: 1
      field_group: anomaly_table_fixes
      hint_ru: 'Word OOXML хранит толщину в восьмых долях пункта: 4 = 0,5 pt.'
    - id: normalize_cell_margins
      type: checkbox
      label: Normalize cell margins
      label_ru: Унифицировать поля ячеек
      default: false
      field_group: anomaly_table_fixes
      hint_ru: Ставит единые внутренние поля ячеек. По умолчанию выключено, чтобы не менять плотность всех таблиц без явного выбора.
    - id: cell_margin_cm
      type: number
      label: Cell margin, cm
      label_ru: Поля ячеек, см
      default: 0.2
      min: 0
      max: 1
      step: 0.05
      field_group: anomaly_table_fixes
      hint_ru: Значение для внутренних полей ячеек при включённой унификации.
  - id: docx_nonprinting_clean
    title: Remove DOCX nonprinting garbage
    title_ru: Удалить непечатаемый мусор DOCX
    description: Conservatively remove optional-hyphen artifacts from DOCX copies without touching spaces, tabs, breaks, visible hyphens, or layout controls.
    description_ru: Осторожно удалить мягкие переносы из копий DOCX, не трогая пробелы, табы, разрывы, видимые дефисы и управляющие переносами символы.
    service: system_core.services.office_service:docx_nonprinting_clean
    kind: safe
- id: find_replace
  title: Find and replace
  title_ru: Найти и заменить
  description: High-precision DOCX/XLSX text replacement tools.
  description_ru: Точные инструменты поиска и замены текста в DOCX/XLSX.
  children:
  - id: docx_comma_lowercase
    title: Comma lowercase
    title_ru: Регистр после запятых
    description: Report suspicious uppercase words after commas inside DOCX table cells only; optionally lowercase ordinary
      words while protecting abbreviations and Roman numerals. Every hit is listed with post-edit context.
    description_ru: Найти подозрительные заглавные слова после запятых только внутри ячеек таблиц DOCX; при необходимости
      понизить регистр обычных слов, не трогая аббревиатуры и римские цифры. Каждое срабатывание попадает в отчёт с контекстом
      после правки.
    service: system_core.services.office_service:docx_comma_lowercase
    kind: safe
    fields:
    - id: dry_run
      type: checkbox
      label: Dry-run
      label_ru: Пробный запуск без записи DOCX
      default: true
    - id: keep_words
      type: text
      label: Keep words
      label_ru: Не менять слова
      default: ''
      hint_ru: CSV или путь к TXT/JSON/YAML-списку исключений.
    - id: overwrite
      type: checkbox
      label: Overwrite
      label_ru: Разрешить перезапись
      default: false
  - id: morph_replace
    title: Morph replace
    title_ru: Морфологическая замена
    description: Find the same Russian phrase across cases, number, gender, and similar forms; optionally inflect replacement
      text. The report lists every replacement with the full sentence from period to period.
    description_ru: 'Высший уровень морфологической автоматизации: найти ту же русскую фразу в падежах, числе, роде и похожих
      формах, а при необходимости согласовать падеж замены. Отчёт показывает каждую замену полным предложением от точки до
      точки.'
    service: system_core.services.office_service:morph_replace
    kind: safe
    fields:
    - id: mode
      type: select
      label: Mode
      label_ru: Режим
      default: replace
      options:
      - value: replace
        label: Replace
        label_ru: Заменить
      - value: append
        label: Append next to match
        label_ru: Добавить рядом
    - id: find
      type: text
      label: Find
      label_ru: Найти
      default: гаражи
    - id: replace
      type: text
      label: Replacement / added phrase
      label_ru: Замена / добавляемая фраза
      default: подземные гаражи
      hint_ru: 'В режиме «Добавить рядом» укажите только добавку, например: подземные гаражи.'
    - id: extensions
      type: text
      label: Extensions
      label_ru: Расширения
      default: .docx,.xlsx
      hint_ru: Только .docx, .xlsx.
    - id: inflect_replacement
      type: checkbox
      label: Inflect replacement
      label_ru: Согласовать падеж замены
      default: true
    - id: dry_run
      type: checkbox
      label: Dry-run
      label_ru: Пробный запуск без записи файлов
      default: true
    - id: overwrite
      type: checkbox
      label: Overwrite
      label_ru: Разрешить перезапись
      default: false
- id: docx_control_cleanup
  title: DOCX control and cleanup
  title_ru: Контроль и очистка DOCX
  description: Quality gates, comment/change cleanup, finalization, and one-click workflow.
  description_ru: Проверка качества, комментарии/правки, финализация и сценарий одной кнопкой.
  children:
  - id: docx_quality_gate
    title: DOCX quality check
    title_ru: Проверка качества DOCX
    description: Scan colors, highlights, comments, and tracked changes.
    description_ru: Проверить цвет шрифта, подсветку, комментарии и правки.
    service: system_core.services.office_service:docx_quality_gate
    kind: safe
  - id: docx_hard_gate
    title: Strict DOCX check
    title_ru: Строгая проверка DOCX
    description: Fail with non-zero exit code when quality issues are found.
    description_ru: Ненулевой код, если найдены проблемы качества.
    service: system_core.services.office_service:docx_hard_gate
    kind: safe
  - id: docx_strip_comments
    title: Strip comments
    title_ru: Удалить комментарии
    description: Remove DOCX comments and markers.

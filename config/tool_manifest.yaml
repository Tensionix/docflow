      label: Compare fields
      label_ru: Поля сравнения
      default: ''
- id: word_excel_tables
  title: WORD/EXCEL TABLES
  title_ru: ТАБЛИЦЫ WORD/EXCEL
  description: DOCX table stitching, unifying, width fitting, orientation adaptation, and extraction.
  description_ru: Сшивание, объединение, оптимизация, адаптация ориентации, вписывание и извлечение таблиц DOCX.
  children:
  - id: docx_table_stitcher
    title: Stitch tables split after PDF export
    title_ru: Сшить разрезанные после экспорта PDF
    description: Conservatively stitch adjacent DOCX table slices after PDF-to-DOCX conversion.
    description_ru: Сшить соседние фрагменты DOCX-таблиц, разрезанные после экспорта PDF в DOCX.

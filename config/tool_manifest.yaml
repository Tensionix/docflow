      label_ru: Закрывать процесс Word перед началом сравнения
      default: false
      span: full
      hint_ru: Опасно при открытых документах Word. Включайте только если готовы принудительно закрыть все окна WINWORD; несохранённые правки могут потеряться.
    - id: word_compare_chunks
      type: text
      label: Chunks
      label_ru: Кусков
      default: ''
      span: compact
      hint_ru: Для режима с числом кусков. Если пусто, DOCX режется по верхнему порядку разделов; если указано число, разделы распределяются примерно на столько кусков.

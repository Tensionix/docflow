      type: select
      label: Pre-header
      label_ru: Строки перед шапкой
      default: separate
      hint_ru: 'Строки перед шапкой: строки над основной шапкой таблицы. Обычное сшивание сохраняет их как есть.'
      options:
      - value: separate
        label: Keep separate
        label_ru: Не включать в повторяемую шапку
      - value: include
        label: Include in header
        label_ru: Считать частью шапки
  - id: docx_table_stitcher_running_header
    title: Stitch and reconstruct repeated headers
    title_ru: Сшить и восстановить повторяемую шапку
    description: Stitch sliced DOCX tables and reconstruct repeated table headers with the dedicated backend engine.
    description_ru: Сшить фрагменты DOCX-таблиц и восстановить повторяемую шапку отдельным специализированным движком.
    service: system_core.services.office_service:docx_table_stitcher_running_header
    kind: safe
    fields:
    - id: preheader_mode
      type: select
      label: Pre-header
      label_ru: Строки перед шапкой
      default: separate
      hint_ru: Определяет, оставить строки перед основной шапкой один раз или включить их в повторяемую шапку.
      options:
      - value: separate
        label: Keep separate
        label_ru: Оставить один раз перед шапкой
      - value: include
        label: Include in repeated header
        label_ru: Включить в повторяемую шапку
  - id: docx_document_tables_unifier
    title: Unify tables in document
    title_ru: Унифицировать таблицы в документе
    description: Normalize table fonts, density-based font sizes, borders, cell margins, column balance, and fit widths to document sections. Bold, italic, and underline are removed from processed tables.
    description_ru: 'Одним проходом привести таблицы к единому виду: два размера шрифта по плотности, границы, поля ячеек, баланс колонок и вписывание в поля разделов. В обработанных таблицах жирность, курсив и подчёркивание убираются.'
    service: system_core.services.office_service:docx_document_tables_unifier
    kind: safe
    fields:
    - id: skip_first_pages
      type: number
      label: Skip first document pages
      label_ru: Не обрабатывать таблицы первых страниц
      default: 2
      step: 1
      min: 0
      span: compact
      field_group: processing_scope
      group_title: Processing scope
      group_title_ru: Область обработки
      group_description: Preserve title-page tables before normalizing the rest of the document.
      group_description_ru: Таблицы первых страниц остаются как в исходнике; остальные таблицы обрабатываются одним проходом.
      hint_ru: Таблицы, которые по служебным разрывам Word относятся к первым N страницам, сохраняются как в исходнике.
    - id: dense_size
      type: number
      label: Small font, pt
      label_ru: Небольшой шрифт, pt
      default: 8
      step: 0.5
      min: 5
      span: compact
      field_group: font_sizes
      group_title: Font sizes
      group_title_ru: Размеры шрифта в таблицах
      group_description: Use a smaller size for dense tables and a larger size for regular tables.
      group_description_ru: Плотные таблицы получают меньший размер, обычные таблицы — больший размер.
      hint_ru: Размер для плотных таблиц с большим числом данных, строк или столбцов.
    - id: normal_size
      type: number
      label: Large font, pt
      label_ru: Большой шрифт, pt
      default: 10
      step: 0.5
      min: 5
      span: compact
      field_group: font_sizes
      hint_ru: Размер для обычных, менее плотных таблиц.
    - id: border_size
      type: number
      label: Border thickness
      label_ru: Толщина границ
      default: 4
      step: 1
      min: 1
      span: compact
      field_group: table_format
      group_title: Table formatting
      group_title_ru: Оформление таблиц
      group_description: Borders and cell padding are unified; bold, italic, and underline are removed automatically.
      group_description_ru: Границы и поля ячеек унифицируются; жирность, курсив и подчёркивание убираются автоматически.

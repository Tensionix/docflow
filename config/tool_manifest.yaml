      default: sections
      options:
      - value: sections
        label: Match sections by similarity
        label_ru: Сопоставлять разделы по похожести
      - value: sequence
        label: Document order
        label_ru: По порядку документа
    - id: docflow_output_mode
      type: select
      label: Output
      label_ru: Результат
      default: redline_report
      options:
      - value: redline_report
        label: Redline DOCX + reports
        label_ru: DOCX с правками + отчёты
      - value: report_only
        label: Reports only
        label_ru: Только отчёты
    - id: docx_a
      type: file
      label: Old DOCX
      label_ru: Старый DOCX
      extensions: .docx
      span: full
      default: ''
    - id: docx_b
      type: file
      label: New DOCX
      label_ru: Новый DOCX
      extensions: .docx
      span: full
      default: ''
  - id: docx_word_compare
    title: Compare via Word
    title_ru: Сравнить с Word COM
    description: Create a native Microsoft Word comparison DOCX with revisions.
    description_ru: Создать нативный DOCX сравнения Microsoft Word с правками.
    service: system_core.services.office_service:docx_word_compare
    kind: safe
    fields:
    - id: word_compare_a
      type: file
      label: Old DOCX
      label_ru: Старый DOCX
      extensions: .docx
      span: full
      default: ''
    - id: word_compare_b
      type: file
      label: New DOCX
      label_ru: Новый DOCX
      extensions: .docx
      span: full
      default: ''
    - id: word_compare_split_mode
      type: radio
      label: Split mode
      label_ru: Разрезка
      default: none
      options:
      - value: none
        label: Do not split
        label_ru: Не разрезать
      - value: smart
        label: Smart split
        label_ru: Разрезать умно
      - value: chunks
        label: Split by chunk count
        label_ru: Разрезать с числом кусков
      span: full
    - id: word_compare_auto_smart_on_problem
      type: checkbox
      label: Enable smart split on problems
      label_ru: Включить умное разрезание документа в случае проблем
      default: true
      span: full
      hint_ru: 'В режиме «Не разрезать» сначала запускается обычный Word COM; если Word падает или зависает, DocFlow переходит к умной разрезке: около 8 крупных кусков, затем дихотомия проблемных долей.'
    - id: word_compare_close_word_before_compare

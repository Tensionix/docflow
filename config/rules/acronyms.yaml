# Правила аудита DOCX: аббревиатуры.
# Как устроено правило и как проверить примеры - config/rules/rules.md, раздел «Файлы правил».
version: 1
set: acronyms
title_ru: "Аббревиатуры"
title_en: "Acronyms"

rules:
  - code: AUDIT-RF-SCAN
    status: implemented
    action: suggest
    severity: warning
    title_ru: "Сокращение РФ"
    title_en: "The РФ abbreviation"
    description_ru: "Фиксирует сокращение РФ для ручной замены полным названием в нужном падеже. Не исправляется автоматически из-за падежа, цитат, реквизитов и официальных названий."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md), раздел «Жесткие ограничения»: РФ заменяется полным названием"
    match: '\bРФ\b'
    replace: 'Российская Федерация / Российской Федерации (проверить падеж)'
    fix:
      "РФ": "Российская Федерация / Российской Федерации (проверить падеж)"
    keep:
      - "Российская Федерация"
      - "РФА"

  - code: AUDIT-ACRONYM-CASE
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Регистр аббревиатур: ГОСТ, СНиП, СанПиН, ФЗ"
    title_en: "Acronym case: ГОСТ, СНиП, СанПиН, ФЗ"
    description_ru: "Гост -> ГОСТ, СНИП -> СНиП, Санпин -> СанПиН, 190-фз -> 190-ФЗ. Написание - по словарю canon."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md): написание как в официальных наименованиях документов; внешний источник не собран"
    ignore_case: true
    match: '(?<![А-Яа-яЁёA-Za-z])(?P<word>гост|снип|санпин|фз)(?![А-Яа-яЁёA-Za-z])'
    replace: '{word|canon}'
    canon:
      "гост": "ГОСТ"
      "снип": "СНиП"
      "санпин": "СанПиН"
      "фз": "ФЗ"
    fix:
      "Гост Р 21.101": "ГОСТ Р 21.101"
      "СНИП 2.04.01": "СНиП 2.04.01"
      "Санпин 2.1.3684": "СанПиН 2.1.3684"
      "№ 190-фз": "№ 190-ФЗ"
    keep:
      - "ГОСТ Р 21.101"
      - "СанПиН"
      - "гостиница"

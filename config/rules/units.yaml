# Правила аудита DOCX: единицы измерения, проценты и градусы.
# Как устроено правило и как проверить примеры - config/rules/rules.md, раздел «Файлы правил».
version: 1
set: units
title_ru: "Единицы измерения, проценты и градусы"
title_en: "Units of measure, percent and degrees"

lists:
  # Точка после «кв.м.» снимается, только если фраза продолжается: перед
  # заглавной буквой и в конце текста она может закрывать предложение.
  square_metre:
    - 'кв\.?м(?:\.(?=(?-i:{SP}*[^\sА-ЯЁA-Z])))?'
    - 'кв\.\s+м'
    - 'кв\s+м'
    - 'кв\.?\s*метр(?:а|ов)?'
    - 'квадратн(?:ый|ого|ому|ым|ом|ая|ой|ую|ые|ых|ыми)?\s+метр(?:а|ов)?'
    - 'м(?:2|²)'
  cubic_metre:
    - 'куб\.?м(?:\.(?=(?-i:{SP}*[^\sА-ЯЁA-Z])))?'
    - 'куб\.\s+м'
    - 'куб\s+м'
    - 'куб\.?\s*метр(?:а|ов)?'
    - 'кубическ(?:ий|ого|ому|им|ом|ая|ой|ую|ие|их|ими)?\s+метр(?:а|ов)?'
    - 'м(?:3|³)'
  # Порядок важен только для одинакового начала: «Гкал/ч» раньше «Гкал».
  unit:
    - 'мм'
    - 'см'
    - 'км'
    - 'м'
    - 'га'
    - 'т'
    - 'кг'
    - 'л'
    - 'мл'
    - 'руб\.?'
    - 'Гкал/ч'
    - 'Гкал'
    - 'гкал/ч'
    - 'гкал'
    - 'кВт'
    - 'квт'
    - 'МВт'
    - 'мвт'

rules:
  - code: AUDIT-UNIT-SQM
    status: implemented
    action: fix
    severity: major
    title_ru: "Единицы площади: кв. м"
    title_en: "Area: кв. м"
    description_ru: "Варианты после числа: кв.м, кв м, м2, м², квадратных метров -> кв. м."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md): площадь пишется «кв. м»"
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, таблица единиц СИ: квадратный метр - м2 (м²); по ГОСТ пишут «м²», норма проекта от него отступает"
    ignore_case: true
    match: '{NUM}{SP}*{list:square_metre}{END}'
    replace: '{num} кв. м'
    fix:
      "10кв.м": "10 кв. м"
      "10 кв м": "10 кв. м"
      "10 м2": "10 кв. м"
      "10 м²": "10 кв. м"
      "10 квадратных метров": "10 кв. м"
      "площадь 10 кв.м. и далее": "площадь 10 кв. м и далее"
      "Итого 10 кв.м.": "Итого 10 кв. м."
      "10\u00A0кв.м": "10\u00A0кв. м"
      "1\u00A0000 м2": "1\u00A0000 кв. м"
    keep:
      - "10 кв. м"
      - "0,5\u00A0кв.\u00A0м"
      - "длина 5 м 2 шт."
      - "в м2 без числа"

  - code: AUDIT-UNIT-CUBIC
    status: implemented
    action: fix
    severity: major
    title_ru: "Единицы объёма: куб. м"
    title_en: "Volume: куб. м"
    description_ru: "Варианты после числа: куб.м, куб м, м3, м³, кубических метров -> куб. м."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md): объём пишется «куб. м»"
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, таблица единиц СИ: кубический метр - м3 (м³); по ГОСТ пишут «м³», норма проекта от него отступает"
    ignore_case: true
    match: '{NUM}{SP}*{list:cubic_metre}{END}'
    replace: '{num} куб. м'
    fix:
      "15куб.м": "15 куб. м"
      "15 м3": "15 куб. м"
      "15 м³": "15 куб. м"
      "15 кубических метров": "15 куб. м"
      "объём 15 куб.м. в сутки": "объём 15 куб. м в сутки"
    keep:
      - "15 куб. м"
      - "0,5\u00A0куб.\u00A0м"
      - "в м3 без числа"

  - code: AUDIT-UNIT-SPACE
    status: implemented
    action: fix
    severity: minor
    title_ru: "Пробел между числом и единицей измерения"
    title_en: "Space between a number and its unit"
    description_ru: "Пробел в безопасных случаях: 10м, 5км, 20га, 3Гкал/ч, 100руб. Регистр единицы - по словарю canon."
    sources:
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, п. 8.3: между последней цифрой числа и обозначением единицы оставляют пробел - правильно 100 кВт, неправильно 100кВт"
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, п. 8.2: в обозначениях единиц точку как знак сокращения не ставят"
      - "Грамота.ру, вопрос 226583: кг, км, г, м, т - без точки - https://gramota.ru/spravka/vopros/226583"
    match: '{NUM}(?P<unit>{list:unit}){END}'
    replace: '{num} {unit|canon}'
    canon:
      "гкал/ч": "Гкал/ч"
      "гкал": "Гкал"
      "квт": "кВт"
      "мвт": "МВт"
      "руб": "руб."
      "руб.": "руб."
    fix:
      "10м": "10 м"
      "5км": "5 км"
      "20га": "20 га"
      "3Гкал/ч": "3 Гкал/ч"
      "3гкал": "3 Гкал"
      "5квт": "5 кВт"
      "100руб.": "100 руб."
      "100руб": "100 руб."
    keep:
      - "10 м"
      - "10\u00A0м"
      - "5мин"
      - "ТП10м"

  # Проценты: норма проекта (ПРАВИЛА) и ГОСТ. Переключатель - в окне «Аудит правил DOCX».
  - code: AUDIT-PERCENT
    norms: [rules]
    status: implemented
    action: fix
    severity: minor
    title_ru: "Процент без пробела: 50%"
    title_en: "Percent without a space: 50%"
    description_ru: "Норма проекта: знак процента вплотную к числу; пробел снимается, неразрывный тоже."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md), решение руководства: знак процента вплотную к числу - 50%"
    match: '{NUM}{SP}+%'
    replace: '{num}%'
    fix:
      "50 %": "50%"
      "52\u00A0%": "52%"
      "10–15 %": "10–15%"
    keep:
      - "50%"
      - "знак %"

  - code: AUDIT-PERCENT
    norms: [gost]
    status: implemented
    action: fix
    severity: minor
    title_ru: "Процент через неразрывный пробел: 50 %"
    title_en: "Percent after a non-breaking space: 50 %"
    description_ru: "ГОСТ 8.417-2024, п. 8.3: 80 %; неразрывный пробел не даёт числу и знаку разойтись по строкам."
    sources:
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, п. 8.3, пример: правильно 80 %, неправильно 80%"
    match: '{NUM}{SP}*%'
    replace: '{num}{NBSP}%'
    fix:
      "50%": "50\u00A0%"
      "50 %": "50\u00A0%"
    keep:
      - "50\u00A0%"
      - "знак %"

  # Градусы. ПРАВИЛА пишут шкалу латинской C; ГОСТ ставит пробел и оставляет букву как в тексте
  # (в ГОСТ 8.417-2024 градус Цельсия записан латинской C).
  - code: AUDIT-DEGREE
    norms: [rules]
    status: implemented
    action: fix
    severity: minor
    title_ru: "Градусы без пробела: 5°, 5°C"
    title_en: "Degrees without a space: 5°, 5°C"
    description_ru: "Норма проекта: знак градуса вплотную к числу, шкала Цельсия - латинской C."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md), решение руководства: 5°C вплотную, шкала латинской C"
    cases:
      - match: '{NUM}{SP}*°{SP}*(?P<scale>[Cc\u0421\u0441])(?![A-Za-zА-Яа-яЁё])'
        replace: "{num}°C"
      - match: '{NUM}{SP}+°(?!{SP}*[Cc\u0421\u0441](?![A-Za-zА-Яа-яЁё]))'
        replace: '{num}°'
    fix:
      "5 °": "5°"
      "5 °C": "5°C"
      "-12 °C": "-12°C"
      "64\u00A0°\u0421": "64°C"
      "угол 5 ° между осями": "угол 5° между осями"
    keep:
      - "5°"
      - "5°C"
      - "уклон 5° Севернее"

  - code: AUDIT-DEGREE
    norms: [gost]
    status: implemented
    action: fix
    severity: minor
    title_ru: "Градусы по ГОСТ: 20 °C, угол 20°"
    title_en: "Degrees by GOST: 20 °C, angle 20°"
    description_ru: "ГОСТ 8.417-2024, п. 8.3: температура - через неразрывный пробел, угловой градус без шкалы - вплотную к числу. Буква шкалы остаётся как в тексте, строчная становится прописной."
    sources:
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, п. 8.3, пример: правильно 20 °C, неправильно 20°C; знак над строкой без пробела - правильно 20°, неправильно 20 °"
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, таблица производных единиц: градус Цельсия - °C, латинская C в международной и в русской графе"
    canon:
      "c": "C"
      "\u0441": "\u0421"
    cases:
      - match: '{NUM}{SP}*°{SP}*(?P<scale>[Cc\u0421\u0441])(?![A-Za-zА-Яа-яЁё])'
        replace: '{num}{NBSP}°{scale|canon}'
      - match: '{NUM}{SP}+°(?!{SP}*[Cc\u0421\u0441](?![A-Za-zА-Яа-яЁё]))'
        replace: '{num}°'
    fix:
      "20°C": "20\u00A0°C"
      "20 °\u0421": "20\u00A0°\u0421"
      "-12°C": "-12\u00A0°C"
      "5 °c": "5\u00A0°C"
      "угол 20 °": "угол 20°"
    keep:
      - "20\u00A0°C"
      - "20\u00A0°\u0421"
      - "угол 20°"
      - "уклон 5° Севернее"

  - code: AUDIT-UNIT-SLASH
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Единица через косую черту без пробелов: руб./сут"
    title_en: "Compound unit without spaces around the slash"
    description_ru: "руб. / сут -> руб./сут, куб. м / ч -> куб. м/ч. Закрытый список единиц."
    sources:
      - "ГОСТ 8.417-2024 - data/ГОСТ-8_417-2024.docx, п. 8.10: при косой черте обозначения единиц в числителе и знаменателе помещают в строку"
    match: '(?<![А-Яа-яЁё])(?P<first>руб\.|куб\.{SP}?м|кв\.{SP}?м|Гкал|кВт|МВт|т|м)(?:{SP}+/{SP}*|/{SP}+)(?P<second>сут\.?|ч|год|мес\.?|чел\.?|м|га|ед\.?)(?![А-Яа-яЁё])'
    replace: '{first}/{second}'
    fix:
      "руб. / сут": "руб./сут"
      "куб. м / ч": "куб. м/ч"
      "Гкал /ч": "Гкал/ч"
    keep:
      - "руб./сут"
      - "вход / выход"
      - "10 т / 20 м"

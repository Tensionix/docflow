# Правила аудита DOCX: сокращения.
# Все правила здесь - кандидаты: только в отчёт, пока не проверены на записках.
# Как устроено правило и как проверить примеры - config/rules/rules.md, раздел «Файлы правил».
version: 1
set: abbreviations
title_ru: "Сокращения"
title_en: "Abbreviations"

rules:
  # Реестр технических сокращений: у каждой записи - источник.
  #   т у.т., кг у.т., г у.т., кг у.т./Гкал, г у.т./кВт·ч - приказ Минэнерго России от 30.12.2008 № 323
  #     (так пишут нормативы удельного расхода топлива; Грамота.ру, вопрос 216861, приводит
  #     рекомендацию В. В. Лопатина «т усл. т.», но в отраслевых актах её нет);
  #   пог. м - ОКЕИ, код 018 «Погонный метр»;
  #   у. е. - составное сокращение из однобуквенных частей пишется через пробел, как т. е.
  # Гигиена текста эти сокращения не разбивает: пробел после точки в них не ставит.
  - code: AUDIT-ABBR-REGISTRY
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Реестр технических сокращений: т у.т., кг у.т./Гкал, пог. м, у. е."
    title_en: "Registry of technical abbreviations"
    description_ru: "кг.у.т./Гкал -> кг у.т./Гкал, т.у.т/год -> т у.т./год (приказ Минэнерго № 323); 10 м.п. -> 10 пог. м (ОКЕИ 018); у.е. -> у. е."
    sources:
      - "Приказ Минэнерго России от 30.12.2008 № 323: т у.т., кг у.т., г у.т., кг у.т./Гкал, г у.т./кВт·ч (т.у.т. в тексте нет) - https://base.garant.ru/195158/"
      - "Грамота.ру, вопрос 216861: рекомендация В. В. Лопатина «т усл. т.»; в отраслевых актах не применяется - https://gramota.ru/spravka/vopros/216861"
      - "ОКЕИ, код 018: погонный метр - условное обозначение «пог. м» - https://classifikators.ru/okei/018"
      - "у. е. - по образцу составных сокращений: Грамота.ру, вопрос 283534 - https://gramota.ru/spravka/vopros/283534"
    cases:
      - match: '(?<![А-Яа-яЁё])(?P<mass>т|кг|г)\.?{SP}*у\.{SP}*т(?:\.|(?![А-Яа-яЁё]))'
        replace: '{mass} у.т.'
      - match: '{NUM}{SP}*(?:м\.{SP}*п|п\.{SP}*м|пог\.?{SP}*м|м\.{SP}*пог)(?:\.(?={SP}*[^\sА-ЯЁA-Z]))?(?![А-Яа-яЁё])'
        replace: '{num} пог. м'
      - match: '(?<![А-Яа-яЁё])у\.{SP}?е\.(?![А-Яа-яЁё])'
        replace: 'у. е.'
    fix:
      "кг.у.т./Гкал": "кг у.т./Гкал"
      "т.у.т/год": "т у.т./год"
      "г у. т./кВт·ч": "г у.т./кВт·ч"
      "расход 10 т. у. т. в год": "расход 10 т у.т. в год"
      "составляет 3 077,22 м.п.": "составляет 3 077,22 пог. м."
      "10 м.п. трубы": "10 пог. м трубы"
      "10 пог.м": "10 пог. м"
      "5 у.е.": "5 у. е."
    keep:
      - "кг у.т./Гкал"
      - "10 т у.т."
      - "тут же"
      - "10 пог. м"
      - "5 у. е."
      - "в 2020 г. у дома"
      - "М.П."

  - code: AUDIT-ABBR-COMPOUND
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Составные сокращения через пробел: т. е., т. к., и т. д."
    title_en: "Compound abbreviations with a space"
    description_ru: "т.е. -> т. е. Неразрывный пробел между частями уже правильный и остаётся."
    sources:
      - "Грамота.ру, вопрос 283534: «Русский орфографический словарь» (2012) фиксирует и т. д., и т. п., т. е., т. к., т. н. с пробелом - https://gramota.ru/spravka/vopros/283534"
    match: '(?<![А-Яа-яЁёA-Za-z.])т\.(?P<second>[екдпнчо])\.'
    replace: 'т. {second}.'
    fix:
      "т.е.": "т. е."
      "т.к.": "т. к."
      "и т.д.": "и т. д."
      "и т.п.": "и т. п."
      "в т.ч.": "в т. ч."
    keep:
      - "т. е."
      - "т.\u00A0е."
      - "Т.Е. Петрова"
      - "ст.к."

  - code: AUDIT-ABBR-MILLION
    status: candidate
    action: suggest
    severity: minor
    title_ru: "млн, млрд, трлн - без точки"
    title_en: "млн, млрд, трлн without a dot"
    description_ru: "5 млн. руб. -> 5 млн руб. Перед заглавной буквой и в конце текста точка остаётся: она может закрывать предложение."
    sources:
      - "Грамота.ру, вопрос 226583: млн, млрд - без точки - https://gramota.ru/spravka/vopros/226583"
    match: '(?<![А-Яа-яЁё])(?P<word>млн|млрд|трлн)\.(?={SP}*[а-яё0-9(,;])'
    replace: '{word}'
    fix:
      "5 млн. руб.": "5 млн руб."
      "2 млрд. рублей": "2 млрд рублей"
    keep:
      - "5 млн руб."
      - "составит 5 млн. Далее"
      - "составит 5 млн."

  - code: AUDIT-ABBR-THOUSAND
    status: candidate
    action: suggest
    severity: minor
    title_ru: "тыс. - с точкой"
    title_en: "тыс. with a dot"
    description_ru: "5 тыс руб. -> 5 тыс. руб."
    sources:
      - "Грамота.ру, вопрос 226583: тыс. - с точкой - https://gramota.ru/spravka/vopros/226583"
    match: '(?<![А-Яа-яЁё])тыс(?![А-Яа-яЁё.])'
    replace: 'тыс.'
    fix:
      "5 тыс руб.": "5 тыс. руб."
    keep:
      - "5 тыс. руб."
      - "тысяча"

  - code: AUDIT-ABBR-RUB
    status: candidate
    action: suggest
    severity: minor
    title_ru: "руб. - с точкой"
    title_en: "руб. with a dot"
    description_ru: "100 руб -> 100 руб."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md): руб. - с точкой; внешний источник не собран"
    match: '(?<![А-Яа-яЁё])руб(?![А-Яа-яЁё.])'
    replace: 'руб.'
    fix:
      "100 руб": "100 руб."
      "тыс. руб/сут": "тыс. руб./сут"
    keep:
      - "100 руб."
      - "100 рублей"

  - code: AUDIT-ABBR-YEAR
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Год через пробел: 2020 г., 2019-2020 гг."
    title_en: "Year with a space: 2020 г."
    description_ru: "2020г. -> 2020 г. Внимание: «2000г» в технических таблицах бывает граммами."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md): 2020 г.; внешний источник не собран"
    match: '(?<![\d.])(?P<year>(?:1[89]|20)\d{2})(?P<suffix>гг?)\.?(?![А-Яа-яЁё])'
    replace: '{year} {suffix}.'
    fix:
      "в 2020г.": "в 2020 г."
      "в 2020г": "в 2020 г."
      "2019-2020гг.": "2019-2020 гг."
    keep:
      - "в 2020 г."
      - "в 2020 году"
      - "от 20.12.2020г. № 5"

  - code: AUDIT-ABBR-REFERENCE
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Пробел после п., ст., ч., рис., табл. перед номером"
    title_en: "Space after п., ст., ч., рис., табл. before a number"
    description_ru: "п.3.1 -> п. 3.1, ч.1 ст.5 -> ч. 1 ст. 5."
    sources:
      - "Норма проекта - мастер правил аудита (Google AI Studio/00_AUDIT_RULES_MASTER.md): п. 3.1, ст. 5, рис. 2; внешний источник не собран"
    match: '(?<![А-Яа-яЁё])(?P<word>пп|п|ч|ст|гл|разд|прил|рис|табл)\.(?=\d)'
    replace: '{word}. '
    fix:
      "п.3.1": "п. 3.1"
      "ч.1 ст.5": "ч. 1 ст. 5"
      "рис.2": "рис. 2"
    keep:
      - "п. 3.1"
      - "п.\u00A03"

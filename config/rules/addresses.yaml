# Правила аудита DOCX: исправления адресов - как пишутся сокращения и пробелы в адресе.
# Типы населённых пунктов, улиц и частей дома и их запись берутся из адресного движка
# system_core/address_engine (копия из Audion Address Processor).
# Правильность самого адреса (название улицы, номер дома, падеж) правилами не проверить - это LLM или справочник.
# Все правила здесь - кандидаты: только в отчёт, пока не проверены на записках.
# Как устроено правило и как проверить примеры - config/rules/rules.md, раздел «Файлы правил».
version: 1
set: addresses
title_ru: "Исправления адресов"
title_en: "Address fixes"

lists:
  # Слово названия: с заглавной буквы или число, плюс «лет» и «имени» внутри названий.
  name_word:
    - '[А-ЯЁ0-9][А-Яа-яЁё0-9-]*'
    - 'лет'
    - 'им\.'
    - 'имени'
  house_marker:
    - 'д'
    - 'дом'
    - 'зд'
    - 'здание'
    - 'стр'
    - 'строение'
    - 'вл'
    - 'влд'
    - 'владение'
  house_part:
    - 'к'
    - 'кор'
    - 'корп'
    - 'корпус'
    - 'стр'
    - 'строение'
    - 'лит'
    - 'литера'

rules:
  # Адрес целиком: [населённый пункт,] улица, дом. Типы - из словарей движка ({address:settlement},
  # {address:street}): город, посёлок, станица, хутор, слобода, ж/д станция, улица, проспект,
  # тракт, микрорайон и сотни других. Обозначения в адресе строчные: тип с заглавной буквы -
  # это начало предложения, имя или инициал («Г.Петров», «Д. Иванов»), в адрес он не попадает.
  # Тип без точки - только слово из двух букв и больше: «с Ивановым» не адрес.
  # Запись даёт движок ({address|address}); названия, номера, литеры и их порядок обязаны
  # остаться как в тексте, иначе адрес не трогается.
  - code: AUDIT-ADDR-WRITING
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Запись адреса: сокращения и пробелы, как в адресном движке"
    title_en: "Address writing: abbreviations and spaces by the address engine"
    description_ru: "п.Московский, ул.Новая, 1б -> п. Московский, ул. Новая, д. 1б; станица -> ст-ца, хутор -> х., улица -> ул., дом -> д., корпус -> к."
    sources:
      - "Приказ Минфина России от 05.11.2015 № 171н (ред. от 03.12.2025), Правила сокращенного наименования адресообразующих элементов, п. 4 и приложение: г., п., с., д., х., ст-ца, сл., ул., пер., пр-кт, пр-д, б-р, наб., пл., туп., ш., мкр., д., к., стр., зд. - https://base.garant.ru/71249284/"
    match: '(?P<address>(?<![А-Яа-яЁё])(?:(?:{address:settlement}\.|(?=[а-яё]{2}){address:settlement}(?={SP})){SP}*{list:name_word}(?:{SP}+{list:name_word}){0,3}{SP}*,{SP}*)?(?:{address:street}\.+|(?=[а-яё]{2}){address:street}(?={SP})){SP}*{list:name_word}(?:{SP}+{list:name_word}){0,3}{SP}*,?{SP}*(?:{list:house_marker}\.?{SP}*)?\d{1,4}(?:{SP}?[А-Яа-яЁё](?![А-Яа-яЁё\d]))?(?:/\d{1,4}[А-Яа-я]?)?(?:{SP}*,?{SP}*{list:house_part}(?:\.{SP}*|{SP}+|(?=\d))[0-9А-Яа-я]{1,4}(?![А-Яа-яЁё]))*)(?![\dА-Яа-яЁё])'
    replace: '{address|address}'
    fix:
      "п.Московский, ул.Новая, 1б": "п. Московский, ул. Новая, д. 1б"
      "п.\u00A0Московский, ул.\u00A0Новая, 1б": "п.\u00A0Московский, ул.\u00A0Новая, д. 1б"
      "станица Каневская, улица Горького, дом 5": "ст-ца Каневская, ул. Горького, д. 5"
      "хутор Лебяжий, ул. Степная,2": "х. Лебяжий, ул. Степная, д. 2"
      "город Тюмень, улица Ленина, дом 5": "город Тюмень, ул. Ленина, д. 5"
      "д. Патрушева, ул. Льва Толстого, зд.2": "д. Патрушева, ул. Льва Толстого, зд. 2"
      "пгт Боровский, ул.Островского, д.3, стр.1": "пгт Боровский, ул. Островского, д. 3, стр. 1"
      "р.п. Винзили, ул. Гагарина, 7": "р. п. Винзили, ул. Гагарина, д. 7"
      "мкр.Восточный, 5": "мкр. Восточный, д. 5"
      "пр-т Мира, 5к1": "пр-кт Мира, д. 5, к. 1"
      "в посёлке, по адресу ул. 50 лет Октября, 57А": "в посёлке, по адресу ул. 50 лет Октября, д. 57А"
      "Иванов И.И., п.Московский, ул.Новая, 1б": "Иванов И.И., п. Московский, ул. Новая, д. 1б"
      "ул Ленина, д 5": "ул. Ленина, д. 5"
      "пос Московский, ул Новая, 1б": "пос. Московский, ул. Новая, д. 1б"
    keep:
      - "п. Московский, ул. Новая, д. 1б"
      - "с Ивановым, ул. Ленина, д. 5"
      - "С.Петров, ул. Ленина, д. 5"
      - "Г.Петров, ул. Ленина, д. 5"
      - "Д. Иванов, ул. Мира, д. 2"
      - "Ул. Ленина, д. 5"
      - "Посёлок Московский, ул. Новая, д. 1б"
      - "ул. Ленина будет реконструирована в 2025 году"
      - "за период 2020–2024 годы"
      - "плюс 2,1 °С"
      - "ул. Мира, д. 2, кв. 5"
      - "пер. Солнечный, д. 3/1"
      - "сл.Никольская, пер.Садовый, д. 3"

  - code: AUDIT-ADDR-TYPE-SPACE
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Пробел после сокращения в адресе: г. Тюмень, ул. Ленина, д. 5"
    title_en: "Space after an address abbreviation"
    description_ru: "Перед названием - г., с., п., д., ул., пер., просп., наб., пл., мкр; перед номером - д., корп., стр., лит., зд., вл."
    sources:
      - "Приказ Минфина России от 05.11.2015 № 171н (ред. от 03.12.2025), Правила сокращенного наименования адресообразующих элементов, п. 4 и приложение: г., п., с., д., х., ст-ца, сл., ул., пер., пр-кт, пр-д, б-р, наб., пл., туп., ш., мкр., д., к., стр., зд. - https://base.garant.ru/71249284/"
    cases:
      - match: '(?<![А-Яа-яЁё])(?P<type>ул|пер|просп|пр-кт|наб|пл|мкр|пгт|г|с|п|д)\.(?=[А-ЯЁ«"])'
        replace: '{type}. '
      - match: '(?<![А-Яа-яЁё])(?P<type>д|корп|стр|лит|зд|вл)\.(?=\d)'
        replace: '{type}. '
    fix:
      "г.Тюмень, ул.Ленина, д.5, корп.1": "г. Тюмень, ул. Ленина, д. 5, корп. 1"
      "д.Ивановка": "д. Ивановка"
    keep:
      - "г. Тюмень, ул. Ленина, д. 5"
      - "И.И. Иванов"
      - "т.е. далее"

  - code: AUDIT-ADDR-TYPE-DOT
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Точка после сокращения в адресе: ул Ленина -> ул. Ленина"
    title_en: "Dot after an address abbreviation"
    description_ru: "Многобуквенные сокращения перед названием и д., корп., стр. перед номером дома."
    sources:
      - "Приказ Минфина России от 05.11.2015 № 171н (ред. от 03.12.2025), Правила сокращенного наименования адресообразующих элементов, п. 4 и приложение: г., п., с., д., х., ст-ца, сл., ул., пер., пр-кт, пр-д, б-р, наб., пл., туп., ш., мкр., д., к., стр., зд. - https://base.garant.ru/71249284/"
    cases:
      - match: '(?<![А-Яа-яЁё])(?P<type>ул|пер|просп|наб|мкр)(?={SP}+[А-ЯЁ«"])'
        replace: '{type}.'
      - match: '(?<![А-Яа-яЁё])(?P<type>д|корп|стр)(?={SP}+\d)'
        replace: '{type}.'
    fix:
      "ул Ленина, д 5": "ул. Ленина, д. 5"
      "корп 2": "корп. 2"
    keep:
      - "ул. Ленина, д. 5"
      - "набор Данных"

  - code: AUDIT-ADDR-DOUBLE-DOT
    status: candidate
    action: suggest
    severity: minor
    title_ru: "Двойная точка после сокращения: ул.. -> ул."
    title_en: "Double dot after an abbreviation"
    description_ru: "ул.. Сергея Свиридова -> ул. Сергея Свиридова. Многоточие не трогается."
    sources:
      - "Приказ Минфина России от 05.11.2015 № 171н (ред. от 03.12.2025), Правила сокращенного наименования адресообразующих элементов, п. 4 и приложение: г., п., с., д., х., ст-ца, сл., ул., пер., пр-кт, пр-д, б-р, наб., пл., туп., ш., мкр., д., к., стр., зд. - https://base.garant.ru/71249284/"
    match: '(?<![А-Яа-яЁё])(?P<type>ул|пер|просп|наб|пл|мкр|г|с|п|д|корп|стр)\.\.(?!\.)'
    replace: '{type}.'
    fix:
      "ул.. Сергея Свиридова": "ул. Сергея Свиридова"
    keep:
      - "ул. Сергея Свиридова"
      - "и т.д..."
